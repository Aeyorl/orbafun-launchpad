[workspace]
resolver = "2"
members = [
  "contracts/token",
  "contracts/launchpad",
  "backend",
]
exclude = ["sandbox-tests"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
borsh = "1.5"
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
