# Orba — Local Development Infrastructure
# Run: docker compose up -d
# This starts PostgreSQL and Redis for local development.
# The API and indexer connect to these services.

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbafun-postgres
    environment:
      POSTGRES_DB: orbafun
      POSTGRES_USER: orbafun
      POSTGRES_PASSWORD: orbafun_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbafun"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbafun-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
