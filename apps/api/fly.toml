# Orba API — Fly.io configuration
# See: https://fly.io/docs/reference/configuration/
#
# Deploy with: fly deploy --config apps/api/fly.toml
# The app runs a persistent NestJS process (indexer poller + WebSocket server).
# Free tier: shared-cpu-1x, 256MB RAM — enough for initial mainnet traffic.

app = "orbafun-api"
primary_region = "iad"  # Washington, DC — closest to Arc RPC endpoints

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT = "4000"
  NODE_ENV = "production"
  # Arc mainnet config (public — no secrets here)
  ARC_RPC_URLS = "https://rpc.mainnet.arc.io,https://rpc.drpc.mainnet.arc.io,https://rpc.quicknode.mainnet.arc.io,https://rpc.blockdaemon.mainnet.arc.io"
  ARC_CHAIN_ID = "5042"
  ARC_USDC_ADDRESS = "0x3600000000000000000000000000000000000000"
  ARC_TOKEN_FACTORY_ADDRESS = "0x8e5710fc5a3f2aA69104AC1b57E6916F7634701B"
  ARC_TREASURY_ADDRESS = "0xD81C2CDa790231a8e701911175519d3521F1d51c"
  ARC_MIGRATOR_ADDRESS = "0xd5F18F71FdFB6eB8fC49b32b2B264aC162F31525"
  ARC_AMM_FACTORY_ADDRESS = "0x7B43cEDAA3e96c98D6f8c981d9d8BF4bFB443A7c"
  ARC_POLLER_ENABLED = "true"
  AUTH_ALLOW_INSECURE = "false"
  # CORS — set to your Vercel frontend URL after deploying the frontend.
  # Restrict this to the production frontend domain in Fly secrets/config.
  CORS_ORIGIN = "*"

# Secrets (set via `fly secrets set` — NOT in this file):
#   fly secrets set POSTGRES_HOST=... POSTGRES_PORT=... POSTGRES_DB=... \
#     POSTGRES_USER=... POSTGRES_PASSWORD=... \
#     REDIS_URL=... \
#     AUTH_SECRET=... \
#     DEPLOYER_PRIVATE_KEY=... \
#     ADMIN_WALLETS=... \
#     PINATA_JWT=...

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false  # NEVER stop — indexer + WebSocket must run 24/7
  auto_start_machines = true
  min_machines_running = 1    # always keep 1 machine running

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

# VM config — smallest available (free tier eligible).
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
