# Orba API — Fly.io configuration
# See: https://fly.io/docs/reference/configuration/
#
# Deploy with: fly deploy --config apps/api/fly.toml
# The app runs a persistent NestJS process (indexer poller + WebSocket server).
# Free tier: shared-cpu-1x, 256MB RAM — enough for testnet traffic.

app = "orbafun-api"
primary_region = "iad"  # Washington, DC — closest to Arc RPC endpoints

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT = "4000"
  NODE_ENV = "production"
  # Arc testnet config (public — no secrets here)
  ARC_RPC_URLS = "https://rpc.testnet.arc.io,https://rpc.drpc.testnet.arc.io,https://rpc.quicknode.testnet.arc.io,https://rpc.blockdaemon.testnet.arc.io"
  ARC_CHAIN_ID = "5042002"
  ARC_USDC_ADDRESS = "0x3600000000000000000000000000000000000000"
  ARC_TOKEN_FACTORY_ADDRESS = "0x8b59B3c4B7A634d8599e4DFB6891CEefd5CA424b"
  ARC_TREASURY_ADDRESS = "0x2cAc61423fe5d7e74e5f3504901478F52a71156D"
  ARC_MIGRATOR_ADDRESS = "0x34d4eC02a916164F178885B7ed05127D40847212"
  ARC_AMM_FACTORY_ADDRESS = "0x4058646F179a4f5dF430E8e125b8F30fF3489BF9"
  ARC_POLLER_ENABLED = "true"
  # AUTH_ALLOW_INSECURE must be "false" for production — set to true only
  # for testnet if wallet signature auth is not yet wired up on the frontend.
  AUTH_ALLOW_INSECURE = "true"
  # CORS — set to your Vercel frontend URL after deploying the frontend.
  # For now, allow all origins (testnet only).
  CORS_ORIGIN = "*"

# Secrets (set via `fly secrets set` — NOT in this file):
#   fly secrets set POSTGRES_HOST=... POSTGRES_PORT=... POSTGRES_DB=... \
#     POSTGRES_USER=... POSTGRES_PASSWORD=... \
#     REDIS_URL=... \
#     AUTH_SECRET=... \
#     DEPLOYER_PRIVATE_KEY=... \
#     ADMIN_WALLETS=... \
#     PINATA_JWT=...

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false  # NEVER stop — indexer + WebSocket must run 24/7
  auto_start_machines = true
  min_machines_running = 1    # always keep 1 machine running

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

# VM config — smallest available (free tier eligible).
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
