[package]
name = "orba-near-vercel"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
orba-near-api = { path = "../../near/backend" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }

[[bin]]
name = "axum"
path = "api/near_api.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
