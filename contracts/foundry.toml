[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Arc testnet RPC for integration tests (forge test --network arc-testnet)
# Note: anvil cannot reproduce Arc-specific behavior (USDC native, EIP-7708, blocklist)
# Tier 2 integration tests must run against this endpoint, not anvil
[profile.arc-testnet]
eth_rpc_url = "https://rpc.testnet.arc.io"
chain_id = 5042002

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
