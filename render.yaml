# Render Blueprint — Orba backend (API + Postgres + Key Value/Redis)
# See: https://render.com/docs/blueprint-spec
#
# This blueprint provisions the full backend stack in one click:
#   1. Postgres database (orbafun-db)
#   2. Key Value / Redis instance (orbafun-redis)
#   3. API web service (orbafun-api) — NestJS + indexer + WebSocket
#
# The API runs persistently (indexer poller + WebSocket server cannot be
# serverless). Render keeps it running 24/7 (no spin-down on paid plans).
#
# Deploy: Push this repo to GitHub, then go to
#   https://dashboard.render.com/blueprints → New Blueprint → select the repo
# Render will read this file and create all three services automatically.
# Connection env vars (POSTGRES_*, REDIS_URL) are wired via fromDatabase /
# fromService so you don't have to paste them manually.
#
# Secrets (set in Render dashboard → Environment tab after creation):
#   AUTH_SECRET
#   DEPLOYER_PRIVATE_KEY
#   ADMIN_WALLETS
#   PINATA_JWT (optional)
#   CORS_ORIGIN (set to https://orba.fun after the frontend is live)

databases:
  - name: orbafun-db
    databaseName: orbafun
    user: orbafun
    region: oregon
    plan: starter  # $7/month — 1GB RAM, 1 vCPU, includes daily backups

services:
  # Render Key Value (Valkey/Redis-compatible) — used for cache + pub/sub
  # by the WebSocket gateway and rate limiter.
  - type: keyvalue
    name: orbafun-redis
    region: oregon
    plan: free  # 25MB — enough for testnet; upgrade to starter for mainnet
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    maxmemoryPolicy: noeviction  # never evict — pub/sub + rate-limit keys are critical

  # Orba API — NestJS web service.
  - type: web
    name: orbafun-api
    runtime: docker
    # Build from the monorepo root (so workspace deps resolve), but use the
    # API's Dockerfile.
    rootDir: .
    dockerfilePath: ./apps/api/Dockerfile
    region: oregon  # US West — closest to Arc RPC endpoints
    plan: starter   # $7/month — 512MB RAM, no spin-down, always on
    healthCheckPath: /tokens?limit=1
    autoDeploy: true
    envVars:
      # Non-secret config (set directly in the blueprint)
      - key: API_PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: ARC_RPC_URLS
        value: https://rpc.testnet.arc.io,https://rpc.drpc.testnet.arc.io,https://rpc.quicknode.testnet.arc.io,https://rpc.blockdaemon.testnet.arc.io
      - key: ARC_CHAIN_ID
        value: "5042002"
      - key: ARC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: ARC_TOKEN_FACTORY_ADDRESS
        value: "0xA0a06666a065f2fE83d49D72934c54e692907296"
      - key: ARC_TREASURY_ADDRESS
        value: "0xe70CdaC18008857b9BCbBa0c94A41e11C54Fb033"
      - key: ARC_MIGRATOR_ADDRESS
        value: "0x8Bd1D9187C157CCe74881976A0d532210328fC50"
      - key: ARC_AMM_FACTORY_ADDRESS
        value: "0x09109941796E004d86e5383dA0222DCdB43d4b13"
      - key: ARC_POLLER_ENABLED
        value: "true"
      - key: AUTH_ALLOW_INSECURE
        value: "true"
      # Postgres connection — auto-wired from the orbafun-db database above.
      # The migrate script (runs on boot) + the API both read these.
      - key: POSTGRES_HOST
        fromDatabase:
          name: orbafun-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: orbafun-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: orbafun-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: orbafun-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: orbafun-db
          property: password
      # Redis connection — auto-wired from the orbafun-redis Key Value instance.
      # connectionString gives redis://red-xxx:6379, exactly what ioredis expects.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: orbafun-redis
          property: connectionString
      - key: CORS_ORIGIN
        sync: false  # set to https://orba.fun in the dashboard after frontend is live
      # Secrets (set manually in Render dashboard → Environment)
      - key: AUTH_SECRET
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: ADMIN_WALLETS
        sync: false
      - key: PINATA_JWT
        sync: false
