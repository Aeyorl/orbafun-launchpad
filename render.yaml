# Render Blueprint — Orba API only
# See: https://render.com/docs/blueprint-spec
#
# Supabase provides the existing PostgreSQL database and Upstash provides
# Redis. Render runs only the persistent NestJS API, Arc event poller, cron
# jobs, and WebSocket server. No local Docker or Render-managed data services
# are required.

services:
  - type: web
    name: orbafun-api
    runtime: node
    rootDir: .
    region: oregon
    plan: starter
    buildCommand: npm ci --workspace=apps/api --workspace=packages/shared --include-workspace-root --include=dev && npm run build --workspace=packages/shared && npm run build --workspace=apps/api
    preDeployCommand: node apps/api/dist/db/migrate.js
    # npm installs the API's HTTP adapter in its workspace-local node_modules,
    # while the pinned Nest core package is hoisted to the repository root.
    # Expose the workspace modules so Nest can load its adapter at runtime.
    startCommand: NODE_PATH=./apps/api/node_modules node apps/api/dist/main.js
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.12.0"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://orba.fun,https://www.orba.fun
      - key: ARC_RPC_URLS
        value: https://rpc.testnet.arc.network,https://rpc.drpc.testnet.arc.network,https://rpc.quicknode.testnet.arc.network,https://rpc.blockdaemon.testnet.arc.network
      - key: ARC_CHAIN_ID
        value: "5042002"
      - key: ARC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: ARC_TOKEN_FACTORY_ADDRESS
        value: "0x8b59B3c4B7A634d8599e4DFB6891CEefd5CA424b"
      - key: ARC_TREASURY_ADDRESS
        value: "0x2cAc61423fe5d7e74e5f3504901478F52a71156D"
      - key: ARC_MIGRATOR_ADDRESS
        value: "0x34d4eC02a916164F178885B7ed05127D40847212"
      - key: ARC_AMM_FACTORY_ADDRESS
        value: "0x4058646F179a4f5dF430E8e125b8F30fF3489BF9"
      - key: ARC_POLLER_ENABLED
        value: "true"
      - key: AUTH_ALLOW_INSECURE
        value: "false"
      - key: AUTH_SIWE_DOMAINS
        value: orba.fun,www.orba.fun
      - key: AGENT_EXECUTOR_ENABLED
        value: "false"
      - key: DEPLOYER_ACTIONS_ENABLED
        value: "false"
      # Required before enabling platform-funded testnet actions. Values are
      # integer micro-USDC and deliberately have no permissive defaults.
      - key: DEPLOYER_MAX_ACTION_MICRO_USDC
        sync: false
      - key: DEPLOYER_MAX_BALANCE_MICRO_USDC
        sync: false
      - key: PLATFORM_DEPLOYER_DAILY_LIMIT_MICRO_USDC
        sync: false
      - key: PLATFORM_DEPLOYER_MONTHLY_LIMIT_MICRO_USDC
        sync: false
      # Free self-service agents spend from the shared platform deployer and
      # remain disabled until paid/staked creation and owner-wide caps exist.
      - key: REFERRAL_REWARD_PCT_BPS
        value: "10"
      - key: POSTGRES_POOL_MAX
        value: "10"
      - key: POSTGRES_CONNECT_TIMEOUT_MS
        value: "30000"
      - key: REDIS_CONNECT_TIMEOUT_MS
        value: "30000"
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Existing Supabase connection values — enter these in the Render wizard.
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      # Base64-encoded Supabase server root certificate. Required for
      # verify-full TLS; download it from Supabase Database Settings.
      - key: POSTGRES_SSL_CA_BASE64
        sync: false
      # The pre-deploy migration creates this least-privilege login and its
      # RLS policies. The API derives the Supabase pooler username suffix.
      - key: POSTGRES_RUNTIME_ROLE
        value: orbafun_runtime
      - key: POSTGRES_RUNTIME_PASSWORD
        generateValue: true
      # Existing Upstash Redis connection string.
      - key: REDIS_URL
        sync: false
      # Application secrets — never commit their values.
      - key: AUTH_SECRET
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: ADMIN_WALLETS
        sync: false
      - key: PINATA_JWT
        sync: false
