name: Production availability monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-availability-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe production surfaces
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 \
            https://orbafun-api.onrender.com/health/ready > /tmp/api-health.json
          grep -q '"status":"ready"' /tmp/api-health.json
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 \
            https://www.orba.fun/ > /dev/null

      - name: Open or update incident issue
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Production monitor alert'
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="Automated production probes failed at $(date -u +%FT%TZ). Check the Render API readiness endpoint, Vercel frontend, PostgreSQL, Redis, and Arc RPC providers. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close recovered incident issue
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Production monitor alert'
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Production probes recovered at $(date -u +%FT%TZ)."
          fi
