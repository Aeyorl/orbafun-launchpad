name: Release gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      NEXT_PUBLIC_TOKEN_FACTORY_ADDRESS: "0x6CaD9423f886b1098DF47C4C6104DD83D2557eFc"
      NEXT_PUBLIC_UNCAPPED_TOKEN_FACTORY_ADDRESSES: "0x6CaD9423f886b1098DF47C4C6104DD83D2557eFc"
      NEXT_PUBLIC_TREASURY_ADDRESS: "0xDC9471561269845249614cfB4e42cFdd73F2E828"
      NEXT_PUBLIC_MIGRATOR_ADDRESS: "0xcF22F6557D8dDcc7fbA38F6f5784cB50c1744149"
      NEXT_PUBLIC_AMM_FACTORY_ADDRESS: "0xf2FDf9ea4efEFb49910A96e959642112d1A00B8b"
      NEXT_PUBLIC_AMM_ROUTER_ADDRESS: "0x3F762785CC165eFa28108649A15a70dc19D448Cd"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  api:
    name: API quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - run: npm run build

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --root contracts

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
