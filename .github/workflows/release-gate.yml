name: Release gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      NEXT_PUBLIC_TOKEN_FACTORY_ADDRESS: "0x3dD9bA8Aa1d92ebfdBE10438618d643757bE64B3"
      NEXT_PUBLIC_UNCAPPED_TOKEN_FACTORY_ADDRESSES: "0x3dD9bA8Aa1d92ebfdBE10438618d643757bE64B3"
      NEXT_PUBLIC_TREASURY_ADDRESS: "0x41712d8cebdAfc5b7eac343F2add73288248bd5c"
      NEXT_PUBLIC_MIGRATOR_ADDRESS: "0x93E16Bd952E3d60a99E27BB7ED06A612Def7a77d"
      NEXT_PUBLIC_AMM_FACTORY_ADDRESS: "0x9f2E34c3A32819268E6e37c0Cb76F53724F222b1"
      NEXT_PUBLIC_AMM_ROUTER_ADDRESS: "0x194f27364bAdE80DF0C5b4f31CcE667FF6ea8F39"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  api:
    name: API quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - run: npm run build

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - run: forge test --root contracts

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
