name: Release gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      NEXT_PUBLIC_TOKEN_FACTORY_ADDRESS: "0xD6e64999f94e31a290CE006dD2D8dAEA5846b81E"
      NEXT_PUBLIC_UNCAPPED_TOKEN_FACTORY_ADDRESSES: "0xD6e64999f94e31a290CE006dD2D8dAEA5846b81E"
      NEXT_PUBLIC_TREASURY_ADDRESS: "0x26770f604415be9DaBB7211a8d272D4EDB32d9c3"
      NEXT_PUBLIC_MIGRATOR_ADDRESS: "0x07106479Cd70BE67378dA39afB846b363F00cDfe"
      NEXT_PUBLIC_AMM_FACTORY_ADDRESS: "0x50432933755E3d292eE2d7589c3CFab18f5d87BD"
      NEXT_PUBLIC_AMM_ROUTER_ADDRESS: "0x0459984dEE1b0d7b3D031E28f1A68f4DdEC50A6A"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  api:
    name: API quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - run: npm run build

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - run: forge test --root contracts

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
