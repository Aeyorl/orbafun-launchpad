# Orba Indexer Schema — HyperIndex V3
#
# Entities stored by Envio HyperIndex. These are queried via the generated
# GraphQL API. The NestJS API polls this GraphQL API for new events.

type Token {
  id: Bytes!                # MemeToken contract address
  curve: Bytes!             # BondingCurve contract address
  ammPair: Bytes            # AMM pair address (set on graduation)
  creator: Bytes!           # Creator wallet address

  name: String!
  symbol: String!
  image: String!

  # Pricing state — stored as strings for simplicity (API converts to NUMERIC)
  price: String!            # USDC per token (e.g. "0.002027")
  marketCap: String!        # USDC (e.g. "2027000")
  volume24h: String!        # rolling 24h, USDC

  # Curve state (mirrored from contract)
  realUsdc: BigInt!         # 6-dec
  tokensSold: BigInt!       # 18-dec
  creatorFeesAccrued: BigInt!  # 6-dec
  protocolFeesAccrued: BigInt! # 6-dec

  # Lifecycle
  status: String!           # "active" | "graduated" | "paused"
  graduatedAt: Int
  lpBurned: BigInt          # 18-dec

  # Metadata
  createdAtBlock: BigInt!
  createdAtTx: Bytes!
  createdAt: Int!           # timestamp

  # Reverse relationships
  trades: [Trade!]! @derivedFrom(field: "token")
  graduations: [Graduation!]! @derivedFrom(field: "token")
}

type Trade {
  id: String!               # tx_hash + log_index (unique)
  token: Token!             # FK to Token
  wallet: Bytes!            # Trader address
  type: String!             # "buy" | "sell"

  # Amounts
  usdcAmount: BigInt!       # 6-dec
  tokenAmount: BigInt!      # 18-dec
  price: String!            # USDC per token at trade time

  # Curve state after trade
  marketCapAfter: String!
  realUsdcAfter: BigInt!
  tokensSoldAfter: BigInt!

  # Metadata
  txHash: Bytes!
  blockNumber: BigInt!
  logIndex: Int!
  timestamp: Int!
}

type Graduation {
  id: String!               # tx_hash + log_index
  token: Token!             # FK to Token
  ammPair: Bytes!
  lpUsdc: BigInt!           # 6-dec
  lpTokens: BigInt!         # 18-dec
  lpBurned: BigInt!         # 18-dec
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: Int!
}

type AmmSwap {
  id: String!               # tx_hash + log_index
  token: Token!             # FK to Token
  ammPair: Bytes!
  sender: Bytes!
  to: Bytes!
  isBuy: Boolean!           # true = USDC->token, false = token->USDC
  usdcIn: BigInt!           # 6-dec
  usdcOut: BigInt!          # 6-dec
  tokenIn: BigInt!          # 18-dec
  tokenOut: BigInt!         # 18-dec
  priceAfter: String!       # USDC per token
  txHash: Bytes!
  blockNumber: BigInt!
  logIndex: Int!
  timestamp: Int!
}

type User {
  id: Bytes!                # wallet address
  tokensLaunched: Int!
  totalVolumeUsdc: BigInt!  # 6-dec, lifetime volume
  createdAt: Int!
}

type IndexerState {
  id: String!
  lastBlock: BigInt!
  lastBlockHash: Bytes
  lastEventTimestamp: Int
  eventsIndexed: BigInt!
  updatedAt: Int!
}

# Mapping entities for reverse lookups (curve address -> token, amm pair -> token)
type CurveMapping {
  id: Bytes!                # BondingCurve address (lookup key)
  tokenId: Bytes!           # Token address
}

type AmmPairMapping {
  id: Bytes!                # AMMPair address (lookup key)
  tokenId: Bytes!           # Token address
}
